_BASE_: "Base-ISTR.yaml"
MODEL:
  WEIGHTS: "detectron2://ImageNetPretrained/torchvision/R-50.pkl"
  RESNETS:
    DEPTH: 50
    STRIDE_IN_1X1: False
  ISTR:
    NUM_PROPOSALS: 300
    NUM_CLASSES: 3
    MASK_ENCODING_METHOD: "PCA"
    PATH_COMPONENTS: "./projects/LME/coco_2017_train_class_agnosticTrue_whitenTrue_sigmoidTrue_256_siz112.npz"
DATASETS:
  TRAIN: ("coco-big-images-rev_train",)
  TEST:  ("coco-big-images-rev_val",)
SOLVER:
  STEPS: (17000, 20000)
  MAX_ITER: 20000
INPUT:
  FORMAT: "RGB"
